<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyLines</title>
    <meta property="og:title" content="MonkeyLines">
    <meta property="og:description" content="Insult sword fighting with a three-headed monkey. Inspired by The Secret of Monkey Island.">
    <meta property="og:image" content="{{.}}/images/preview.jpg">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:url" content="{{.}}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MonkeyLines">
    <meta name="twitter:description" content="Insult sword fighting with a three-headed monkey. Inspired by The Secret of Monkey Island.">
    <meta name="twitter:image" content="{{.}}/images/preview.jpg">
    <meta name="description" content="Insult sword fighting with a three-headed monkey. Inspired by The Secret of Monkey Island.">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        @font-face {
            font-family: 'Press Start 2P';
            src: url('/images/fonts/PressStart2P-Regular.woff2') format('woff2');
            font-display: swap;
        }

        :root {
            --mi-bg-dark: #1a0a2e;
            --mi-bg-mid: #2d1b4e;
            --mi-teal: #2d8b6e;
            --mi-teal-light: #3aaf8a;
            --mi-amber: #c8a43c;
            --mi-amber-light: #e8c84c;
            --mi-cream: #e8d4a0;
            --mi-text: #e8d4a0;
            --mi-text-dark: #1a0a2e;
            --mi-border: #4a2d6e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
            text-rendering: optimizeSpeed;
            background: var(--mi-bg-dark);
            color: var(--mi-text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .monkey-scene {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--mi-bg-dark);
        }

        .monkey-scene img {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
        }

        .monkey-overlay {
            position: absolute;
            top: 0;
            left: 0;
            visibility: hidden;
        }

        .monkey-overlay.monkey-visible {
            visibility: visible;
        }

        .speech-text {
            position: absolute;
            top: 8%;
            left: 24%;
            width: 54%;
            height: 14%;
            padding: 4px 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(8px, 1.4vw, 12px);
            color: var(--mi-text-dark);
            line-height: 1.2;
            text-align: left;
            overflow: hidden;
        }

        .verb-bar {
            background: var(--mi-bg-dark);
            border-top: 3px solid var(--mi-border);
            padding: 12px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .verb-btn {
            min-width: 44px;
            min-height: 44px;
            padding: 6px 12px;
            background: var(--mi-bg-mid);
            border: 2px solid var(--mi-border);
            border-radius: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verb-btn svg {
            display: block;
        }

        .footer-link {
            color: var(--mi-cream);
            position: fixed;
            bottom: 15px;
            right: 15px;
            opacity: 0.4;
            transition: opacity 0.15s;
        }

        .footer-link:hover {
            opacity: 0.7;
        }

        .footer-link svg {
            display: block;
        }

        .verb-btn:active:not(:disabled) {
            transform: translateY(2px);
        }

        .verb-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .verb-btn.active {
            border-color: var(--mi-teal);
        }

        @media (max-aspect-ratio: 1/1) {
            body {
                padding: 0;
            }

            .container {
                max-width: none;
            }

            .verb-bar {
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="monkey-scene">
            <img src="/images/base.png" alt="Three-headed monkey">
            <img class="monkey-overlay" id="monkey-l" src="/images/l.png" alt="">
            <img class="monkey-overlay" id="monkey-c" src="/images/c.png" alt="">
            <img class="monkey-overlay" id="monkey-r" src="/images/r.png" alt="">
            <div class="speech-text" id="speech-text"></div>
        </div>
        <div class="verb-bar">
            <button class="verb-btn" id="reload-btn" aria-label="New exchange">
                <svg width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="var(--mi-cream)">
                    <!-- Crossed swords / cutlass -->
                    <rect x="12" y="1" width="1" height="1"/>
                    <rect x="11" y="2" width="1" height="1"/>
                    <rect x="10" y="3" width="1" height="1"/>
                    <rect x="9" y="4" width="1" height="1"/>
                    <rect x="8" y="5" width="1" height="1"/>
                    <rect x="7" y="6" width="1" height="1"/>
                    <rect x="6" y="7" width="1" height="1"/>
                    <rect x="5" y="8" width="1" height="1"/>
                    <rect x="3" y="9" width="5" height="1"/>
                    <rect x="4" y="10" width="1" height="1"/>
                    <rect x="3" y="11" width="1" height="1"/>
                    <rect x="2" y="12" width="1" height="1"/>
                    <rect x="1" y="13" width="1" height="1"/>
                    <!-- Guard/crossguard -->
                    <rect x="13" y="2" width="1" height="1"/>
                    <rect x="11" y="1" width="1" height="1"/>
                    <rect x="13" y="3" width="1" height="1"/>
                    <rect x="14" y="1" width="1" height="1"/>
                </svg>
            </button>
            <button class="verb-btn" id="auto-btn" aria-label="Auto-play">
                <svg width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="var(--mi-cream)">
                    <!-- Circular arrows (repeat/loop) -->
                    <!-- Top arrow arc -->
                    <rect x="5" y="2" width="5" height="1"/>
                    <rect x="3" y="3" width="2" height="1"/>
                    <rect x="10" y="3" width="2" height="1"/>
                    <rect x="2" y="4" width="1" height="2"/>
                    <rect x="12" y="4" width="1" height="1"/>
                    <!-- Top arrowhead pointing right -->
                    <rect x="11" y="2" width="1" height="1"/>
                    <rect x="12" y="1" width="1" height="1"/>
                    <rect x="13" y="2" width="1" height="1"/>
                    <rect x="12" y="3" width="1" height="1"/>
                    <!-- Bottom arrow arc -->
                    <rect x="5" y="13" width="5" height="1"/>
                    <rect x="3" y="12" width="2" height="1"/>
                    <rect x="10" y="12" width="2" height="1"/>
                    <rect x="13" y="10" width="1" height="2"/>
                    <rect x="3" y="11" width="1" height="1"/>
                    <!-- Bottom arrowhead pointing left -->
                    <rect x="4" y="13" width="1" height="1"/>
                    <rect x="3" y="14" width="1" height="1"/>
                    <rect x="2" y="13" width="1" height="1"/>
                    <rect x="3" y="12" width="1" height="1"/>
                    <!-- Side connections -->
                    <rect x="13" y="6" width="1" height="4"/>
                    <rect x="2" y="6" width="1" height="4"/>
                </svg>
            </button>
            <button class="verb-btn" id="mute-btn" aria-label="Toggle sound">
                <svg id="mute-icon" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges" fill="var(--mi-cream)">
                    <!-- Speaker body -->
                    <rect x="1" y="5" width="3" height="6"/>
                    <rect x="4" y="4" width="1" height="8"/>
                    <rect x="5" y="3" width="1" height="10"/>
                    <rect x="6" y="2" width="1" height="12"/>
                    <!-- X mark (muted) -->
                    <rect x="9" y="5" width="1" height="1"/>
                    <rect x="13" y="5" width="1" height="1"/>
                    <rect x="10" y="6" width="1" height="1"/>
                    <rect x="12" y="6" width="1" height="1"/>
                    <rect x="11" y="7" width="1" height="2"/>
                    <rect x="10" y="9" width="1" height="1"/>
                    <rect x="12" y="9" width="1" height="1"/>
                    <rect x="9" y="10" width="1" height="1"/>
                    <rect x="13" y="10" width="1" height="1"/>
                </svg>
            </button>
        </div>
        <a class="footer-link" href="https://github.com/dagoonline/monkeylines" target="_blank" aria-label="github.com/dagoonline/monkeylines"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.7.1-.7 1.2.1 1.9 1.3 1.9 1.3 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.3-3.2-.1-.3-.6-1.5.1-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6.2 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.2 2.9.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg></a>
    </div>

    <script>
        (function() {
            var el = document.getElementById('speech-text');
            var btn = document.getElementById('reload-btn');
            var autoBtn = document.getElementById('auto-btn');
            var muteBtn = document.getElementById('mute-btn');
            var overlays = {
                l: document.getElementById('monkey-l'),
                c: document.getElementById('monkey-c'),
                r: document.getElementById('monkey-r')
            };
            var allMonkeys = ['l', 'c', 'r'];
            var sideMonkeys = ['l', 'r'];
            var busy = false;
            var autoPlay = false;
            var muted = true;
            var audioCtx = null;

            function ensureAudio() {
                if (!audioCtx) {
                    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                // Play a silent buffer to unlock audio on iOS/Android
                var buf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
                var src = audioCtx.createBufferSource();
                src.buffer = buf;
                src.connect(audioCtx.destination);
                src.start(0);
            }
            var monkeyVoices = {
                l: { low: 200, high: 360 },
                c: { low: 140, high: 240 },
                r: { low: 260, high: 440 }
            };

            function playHoot(freq, duration) {
                if (!audioCtx || muted || audioCtx.state !== 'running') return;
                var now = audioCtx.currentTime;
                var fade = Math.min(0.05, duration * 0.25);
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'triangle';
                var jitter = 0.95 + Math.random() * 0.1;
                var f = freq * jitter;
                osc.frequency.setValueAtTime(f * 1.08, now);
                osc.frequency.linearRampToValueAtTime(f, now + duration * 0.3);
                osc.frequency.linearRampToValueAtTime(f * (0.85 + Math.random() * 0.15), now + duration);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.07 + Math.random() * 0.03, now + fade);
                gain.gain.linearRampToValueAtTime(0.06, now + duration - fade);
                gain.gain.linearRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.01);
            }

            function hootWord(monkey, charCount) {
                var voice = monkeyVoices[monkey];
                var wordDur = charCount * 0.04;
                var r = Math.random();
                if (charCount <= 2) {
                    playHoot(voice.high * (0.85 + Math.random() * 0.3), wordDur);
                } else if (r < 0.35) {
                    playHoot(voice.low + Math.random() * (voice.high - voice.low), wordDur * 0.9);
                } else if (r < 0.65) {
                    playHoot(voice.high * (0.9 + Math.random() * 0.2), wordDur * 0.9);
                } else {
                    var n = Math.min(charCount, 2 + Math.floor(Math.random() * 3));
                    var gap = wordDur / n;
                    for (var k = 0; k < n; k++) {
                        (function(idx) {
                            setTimeout(function() {
                                playHoot(
                                    (Math.random() < 0.5 ? voice.low : voice.high) * (0.95 + Math.random() * 0.1),
                                    gap * 0.9
                                );
                            }, idx * gap * 1000);
                        })(k);
                    }
                }
            }

function showOverlay(monkey) {
                allMonkeys.forEach(function(m) {
                    overlays[m].classList.remove('monkey-visible');
                });
                if (monkey) {
                    overlays[monkey].classList.add('monkey-visible');
                }
            }

            function pickSideMonkey() {
                return sideMonkeys[Math.floor(Math.random() * sideMonkeys.length)];
            }

            function fitText() {
                el.style.fontSize = '';
                var size = parseFloat(getComputedStyle(el).fontSize);
                while (el.scrollHeight > el.clientHeight && size > 8) {
                    size -= 0.5;
                    el.style.fontSize = size + 'px';
                }
            }

            function typeText(text, monkey) {
                return new Promise(function(resolve) {
                    var visible = document.createElement('span');
                    var hidden = document.createElement('span');
                    hidden.style.visibility = 'hidden';
                    hidden.textContent = text;
                    el.textContent = '';
                    el.appendChild(visible);
                    el.appendChild(hidden);
                    fitText();
                    showOverlay(null);
                    var i = 0;
                    var inWord = false;

                    function step() {
                        if (i < text.length) {
                            var ch = text[i];
                            visible.textContent = text.substring(0, i + 1);
                            hidden.textContent = text.substring(i + 1);

                            if (ch !== ' ' && !inWord) {
                                inWord = true;
                                var end = i + 1;
                                while (end < text.length && text[end] !== ' ') end++;
                                overlays[monkey].classList.add('monkey-visible');
                                hootWord(monkey, end - i);
                            } else if (ch === ' ') {
                                inWord = false;
                                overlays[monkey].classList.remove('monkey-visible');
                            }

                            i++;
                            setTimeout(step, 40);
                        } else {
                            showOverlay(monkey);
                            resolve();
                        }
                    }
                    step();
                });
            }

            function delay(ms) {
                return new Promise(function(resolve) { setTimeout(resolve, ms); });
            }

            function runExchange() {
                busy = true;
                btn.disabled = true;
                if (!autoPlay) autoBtn.disabled = true;
                var monkeyA = pickSideMonkey();

                fetch('/exchange')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        return typeText(data.Insult, monkeyA)
                            .then(function() { showOverlay(null); return delay(2000); })
                            .then(function() { return typeText(data.Comeback, 'c'); });
                    })
                    .then(function() {
                        showOverlay(null);
                        if (autoPlay) {
                            return delay(2000);
                        }
                    })
                    .then(function() {
                        busy = false;
                        if (!autoPlay) {
                            btn.disabled = false;
                            autoBtn.disabled = false;
                        } else {
                            runExchange();
                        }
                    })
                    .catch(function() {
                        showOverlay(null);
                        busy = false;
                        btn.disabled = false;
                        autoBtn.disabled = false;
                        autoPlay = false;
                        autoBtn.classList.remove('active');
                    });
            }

            btn.addEventListener('click', function() {
                if (busy) return;
                ensureAudio();
                runExchange();
            });

            autoBtn.addEventListener('click', function() {
                ensureAudio();
                autoPlay = !autoPlay;
                autoBtn.classList.toggle('active', autoPlay);
                if (autoPlay) {
                    btn.disabled = true;
                    if (!busy) runExchange();
                } else {
                    if (!busy) btn.disabled = false;
                }
            });

            var speakerBody = '<rect x="1" y="5" width="3" height="6"/><rect x="4" y="4" width="1" height="8"/><rect x="5" y="3" width="1" height="10"/><rect x="6" y="2" width="1" height="12"/>';
            var muteX = '<rect x="9" y="5" width="1" height="1"/><rect x="13" y="5" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/><rect x="12" y="6" width="1" height="1"/><rect x="11" y="7" width="1" height="2"/><rect x="10" y="9" width="1" height="1"/><rect x="12" y="9" width="1" height="1"/><rect x="9" y="10" width="1" height="1"/><rect x="13" y="10" width="1" height="1"/>';
            var soundWaves = '<rect x="8" y="6" width="1" height="4"/><rect x="10" y="4" width="1" height="8"/><rect x="12" y="3" width="1" height="10"/>';

            muteBtn.addEventListener('click', function() {
                ensureAudio();
                muted = !muted;
                var muteIcon = document.getElementById('mute-icon');
                muteIcon.innerHTML = speakerBody + (muted ? muteX : soundWaves);
            });

        })();
    </script>
</body>
</html>
